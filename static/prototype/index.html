<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wohnung Scout frontend options</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#e8e9e4;font:13px 'Segoe UI',sans-serif}iframe{display:block;width:100%;height:calc(100dvh - 64px);border:0}.dock{height:44px;position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:#202a25;color:#fff;padding:5px 8px;border-radius:30px;box-shadow:0 4px 28px #0003;white-space:nowrap}button,select{font:inherit;color:inherit;background:transparent;border:0;border-radius:20px;padding:6px 10px;cursor:pointer}button{font-size:21px;padding:0 10px}select{max-width:205px}option{background:#202a25}a{font-size:11px;color:#dceacb;text-decoration:none;padding:0 8px;border-left:1px solid #637565}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #dceacb;outline-offset:2px}@media(max-width:500px){.dock{gap:0;max-width:calc(100% - 16px)}select{max-width:165px;font-size:12px}a{font-size:10px}}</style></head><body>
<iframe id="view" title="Frontend option A"></iframe>
<nav class="dock" aria-label="Frontend preview switcher"><button id="previous" aria-label="Previous frontend">‹</button><select id="variant" aria-label="Frontend option"><option value="A">A · The shortlist</option><option value="B">B · The comparison</option><option value="C">C · The explorer</option></select><button id="next" aria-label="Next frontend">›</button><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">Current app ↗</a></nav>
<script>
const variants={A:'shortlist',B:'compare',C:'market'},keys=Object.keys(variants),frame=document.getElementById('view'),choice=document.getElementById('variant');
let current=keys.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
function show(key){current=key;choice.value=key;history.replaceState(null,'','?variant='+key);frame.title='Frontend option '+key;frame.src='/static/prototype/'+variants[key]+'.html';}
function cycle(step){show(keys[(keys.indexOf(current)+step+keys.length)%keys.length]);}
function keyboard(event){if(event.defaultPrevented||event.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);}}
frame.addEventListener('load',()=>frame.contentWindow.addEventListener('keydown',keyboard));document.addEventListener('keydown',keyboard);choice.addEventListener('change',()=>show(choice.value));document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);show(current);
</script></body></html>
